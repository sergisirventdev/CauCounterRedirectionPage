<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Redirección</title>
  <meta name="robots" content="noindex" />
</head>
<body>
  <noscript>Necesitas activar JavaScript para continuar.</noscript>

  <script>
    // Cambia estas URLs si algún día lo necesitas
    const IOS_URL = "https://apps.apple.com/es/app/clash-royale/id1053012308";
    const ANDROID_URL = "https://play.google.com/store/apps/details?id=com.supercell.clashroyale";

    const ua = navigator.userAgent || "";
    const isAndroid = /Android/i.test(ua);

    // iPadOS moderno puede reportar MacIntel, por eso el extra:
    const isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

    let targetUrl = null;
    let storeName = null;

    if (isIOS) {
      targetUrl = IOS_URL;
      storeName = "la App Store";
    } else if (isAndroid) {
      targetUrl = ANDROID_URL;
      storeName = "Google Play";
    } else {
      // Si no es móvil, no intentamos adivinar
      document.body.innerHTML =
        '<p>Elige tu tienda:</p>' +
        `<p><a href="${IOS_URL}">Abrir App Store</a></p>` +
        `<p><a href="${ANDROID_URL}">Abrir Google Play</a></p>`;
      throw new Error("Plataforma no móvil");
    }

    // Popup nativo del navegador
    const ok = window.confirm(`Se le va a redirigir a ${storeName}. ¿Continuar?`);
    if (ok) {
      window.location.assign(targetUrl);
    } else {
      // Si cancela, mostramos un texto simple (opcional)
      document.body.innerHTML = "<p>Cancelado.</p>";
    }
  </script>
</body>
</html>
